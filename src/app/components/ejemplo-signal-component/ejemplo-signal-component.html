<section class="signal-section">
    <h1>Signal Counter</h1>
    <p class="subtitle">¡Controla tu contador!</p>

    <div class="counter-info">
        <h2>Contador</h2>
        <span class="counter-value">{{contador()}}</span>

        <h2>Doble</h2>
        <span class="double-value">{{doble()}}</span>
    </div>

    <div class="counter-buttons">
        <button class="btn-reset" (click)="reiniciarContador()">
            Reiniciar
        </button>

        <button class="btn-increment" (click)="incrementarContador()">
            Incrementar
        </button>
    </div>
</section>
